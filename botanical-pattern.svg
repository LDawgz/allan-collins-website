<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700">
  <!--
    Botanical art background — luxury spa / stationery aesthetic
    Two composed corner vignettes; stroke-dominant, near-invisible fill
    Tabernanthe iboga: lanceolate leaves in opposite pairs on curved stems
  -->

  <!-- ═══════════════════════════════════════════════════════
