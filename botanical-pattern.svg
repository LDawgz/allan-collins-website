<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700">
  <!--
    Iboga-inspired botanical leaf pattern
    Tabernanthe iboga: glossy lanceolate leaves, opposite pairs on stem
    Used as a subtle repeating background texture — stroke only, very low opacity
  -->

  <!-- ── LEAF SHAPE TEMPLATE (used via transform) ──
       A lanceolate leaf: narrow at both ends, widest at 40% from base
       Midrib + 3 pairs of lateral veins
  -->

  <!-- LARGE LEAF 1 — upper right, angled down-left (~150px long) -->
  <g transform="translate(618, 95) rotate(128)" opacity="0.88">
    <path d="M0,-75 C28,-58 32,15 18,58 C10,72 0,78 0,78 C0,78 -10,72 -18,58 C-32,15 -28,-58 0,-75 Z"
          fill="#B8AFA4" fill-opacity="0.08" stroke="#9A9088" stroke-opacity="0.28" stroke-width="1.3"/>
    <line x1="0" y1="-72" x2="0" y2="75" stroke="#9A9088" stroke-opacity="0.2" stroke-width="0.8"/>
    <path d="M0,-42 C-24,-26 -31,-4 -31,10" stroke="#9A9088" stroke-opacity="0.15" stroke-width="0.6" fill="none"/>
    <path d="M0,-42 C24,-26 31,-4 31,10" stroke="#9A9088" stroke-opacity="0.15" stroke-width="0.6" fill="none"/>
    <path d="M0,-8 C-30,8 -32,24 -28,38" stroke="#9A9088" stroke-opacity="0.13" stroke-width="0.55" fill="none"/>
    <path d="M0,-8 C30,8 32,24 28,38" stroke="#9A9088" stroke-opacity="0.13" stroke-width="0.55" fill="none"/>
    <path d="M0,30 C-18,42 -20,52 -16,60" stroke="#9A9088" stroke-opacity="0.11" stroke-width="0.5" fill="none"/>
    <path d="M0,30 C18,42 20,52 16,60" stroke="#9A9088" stroke-opacity="0.11" stroke-width="0.5" fill="none"/>
    <!-- petiole -->
    <line x1="0" y1="76" x2="0" y2="90" stroke="#9A9088" stroke-opacity="0.18" stroke-width="1.1"/>
  </g>

  <!-- LARGE LEAF 2 — left side, angled right (~170px long) -->
  <g transform="translate(55, 365) rotate(205)" opacity="0.85">
    <path d="M0,-88 C34,-68 38,20 22,68 C12,84 0,90 0,90 C0,90 -12,84 -22,68 C-38,20 -34,-68 0,-88 Z"
          fill="#B8AFA4" fill-opacity="0.07" stroke="#9A9088" stroke-opacity="0.26" stroke-width="1.4"/>
    <line x1="0" y1="-84" x2="0" y2="87" stroke="#9A9088" stroke-opacity="0.18" stroke-width="0.85"/>
    <path d="M0,-52 C-30,-32 -36,-6 -36,10" stroke="#9A9088" stroke-opacity="0.14" stroke-width="0.6" fill="none"/>
    <path d="M0,-52 C30,-32 36,-6 36,10" stroke="#9A9088" stroke-opacity="0.14" stroke-width="0.6" fill="none"/>
    <path d="M0,-12 C-36,6 -37,26 -33,44" stroke="#9A9088" stroke-opacity="0.12" stroke-width="0.55" fill="none"/>
    <path d="M0,-12 C36,6 37,26 33,44" stroke="#9A9088" stroke-opacity="0.12" stroke-width="0.55" fill="none"/>
    <path d="M0,34 C-24,48 -24,60 -20,70" stroke="#9A9088" stroke-opacity="0.1" stroke-width="0.5" fill="none"/>
    <path d="M0,34 C24,48 24,60 20,70" stroke="#9A9088" stroke-opacity="0.1" stroke-width="0.5" fill="none"/>
    <line x1="0" y1="88" x2="0" y2="104" stroke="#9A9088" stroke-opacity="0.16" stroke-width="1.2"/>
  </g>

  <!-- PAIRED LEAVES ON STEM — center right (Iboga grows leaves in opposite pairs) -->
  <g transform="translate(480, 310)">
    <!-- main stem segment -->
    <path d="M0,-55 C3,-20 3,25 0,60" stroke="#9A9088" stroke-opacity="0.22" stroke-width="1.2" fill="none"/>
    <!-- left leaf of pair (upper) -->
    <g transform="translate(-6,-18) rotate(-52)">
      <path d="M0,-52 C20,-40 22,12 12,42 C6,52 0,56 0,56 C0,56 -6,52 -12,42 C-22,12 -20,-40 0,-52 Z"
            fill="#B8AFA4" fill-opacity="0.09" stroke="#9A9088" stroke-opacity="0.26" stroke-width="1.1"/>
      <line x1="0" y1="-49" x2="0" y2="53" stroke="#9A9088" stroke-opacity="0.17" stroke-width="0.7"/>
      <path d="M0,-26 C-18,-14 -21,2 -21,12" stroke="#9A9088" stroke-opacity="0.13" stroke-width="0.5" fill="none"/>
      <path d="M0,-26 C18,-14 21,2 21,12" stroke="#9A9088" stroke-opacity="0.13" stroke-width="0.5" fill="none"/>
      <path d="M0,8 C-21,20 -21,30 -18,38" stroke="#9A9088" stroke-opacity="0.11" stroke-width="0.5" fill="none"/>
      <path d="M0,8 C21,20 21,30 18,38" stroke="#9A9088" stroke-opacity="0.11" stroke-width="0.5" fill="none"/>
    </g>
    <!-- right leaf of pair (upper) -->
    <g transform="translate(6,-18) rotate(48)">
      <path d="M0,-50 C19,-38 21,12 11,40 C5,50 0,54 0,54 C0,54 -5,50 -11,40 C-21,12 -19,-38 0,-50 Z"
            fill="#B8AFA4" fill-opacity="0.09" stroke="#9A9088" stroke-opacity="0.24" stroke-width="1.1"/>
      <line x1="0" y1="-47" x2="0" y2="51" stroke="#9A9088" stroke-opacity="0.16" stroke-width="0.7"/>
      <path d="M0,-24 C-17,-13 -20,2 -20,11" stroke="#9A9088" stroke-opacity="0.12" stroke-width="0.5" fill="none"/>
      <path d="M0,-24 C17,-13 20,2 20,11" stroke="#9A9088" stroke-opacity="0.12" stroke-width="0.5" fill="none"/>
    </g>
    <!-- left leaf of pair (lower) -->
    <g transform="translate(-6,22) rotate(-48)">
      <path d="M0,-45 C17,-34 19,10 10,36 C5,45 0,48 0,48 C0,48 -5,45 -10,36 C-19,10 -17,-34 0,-45 Z"
            fill="#B8AFA4" fill-opacity="0.08" stroke="#9A9088" stroke-opacity="0.22" stroke-width="1"/>
      <line x1="0" y1="-42" x2="0" y2="46" stroke="#9A9088" stroke-opacity="0.15" stroke-width="0.65"/>
      <path d="M0,-22 C-16,-11 -18,3 -18,11" stroke="#9A9088" stroke-opacity="0.11" stroke-width="0.5" fill="none"/>
      <path d="M0,-22 C16,-11 18,3 18,11" stroke="#9A9088" stroke-opacity="0.11" stroke-width="0.5" fill="none"/>
    </g>
    <!-- right leaf of pair (lower) -->
    <g transform="translate(6,22) rotate(44)">
      <path d="M0,-44 C17,-34 18,10 10,35 C5,44 0,47 0,47 C0,47 -5,44 -10,35 C-18,10 -17,-34 0,-44 Z"
            fill="#B8AFA4" fill-opacity="0.08" stroke="#9A9088" stroke-opacity="0.22" stroke-width="1"/>
      <line x1="0" y1="-41" x2="0" y2="45" stroke="#9A9088" stroke-opacity="0.15" stroke-width="0.65"/>
    </g>
  </g>

  <!-- MEDIUM LEAF — top left area -->
  <g transform="translate(140, 72) rotate(315)" opacity="0.9">
    <path d="M0,-62 C24,-48 26,14 14,50 C7,62 0,66 0,66 C0,66 -7,62 -14,50 C-26,14 -24,-48 0,-62 Z"
          fill="#B8AFA4" fill-opacity="0.09" stroke="#9A9088" stroke-opacity="0.27" stroke-width="1.2"/>
    <line x1="0" y1="-59" x2="0" y2="63" stroke="#9A9088" stroke-opacity="0.19" stroke-width="0.75"/>
    <path d="M0,-34 C-22,-20 -25,-2 -25,10" stroke="#9A9088" stroke-opacity="0.14" stroke-width="0.55" fill="none"/>
    <path d="M0,-34 C22,-20 25,-2 25,10" stroke="#9A9088" stroke-opacity="0.14" stroke-width="0.55" fill="none"/>
    <path d="M0,8 C-25,22 -25,34 -21,44" stroke="#9A9088" stroke-opacity="0.12" stroke-width="0.5" fill="none"/>
    <path d="M0,8 C25,22 25,34 21,44" stroke="#9A9088" stroke-opacity="0.12" stroke-width="0.5" fill="none"/>
    <line x1="0" y1="64" x2="0" y2="76" stroke="#9A9088" stroke-opacity="0.17" stroke-width="1"/>
  </g>

  <!-- SMALL LEAF — lower left scattered -->
  <g transform="translate(175, 568) rotate(22)" opacity="0.82">
    <path d="M0,-40 C15,-30 16,8 8,32 C4,40 0,43 0,43 C0,43 -4,40 -8,32 C-16,8 -15,-30 0,-40 Z"
          fill="#B8AFA4" fill-opacity="0.08" stroke="#9A9088" stroke-opacity="0.22" stroke-width="1"/>
    <line x1="0" y1="-38" x2="0" y2="41" stroke="#9A9088" stroke-opacity="0.15" stroke-width="0.65"/>
    <path d="M0,-18 C-13,-8 -15,4 -15,11" stroke="#9A9088" stroke-opacity="0.11" stroke-width="0.5" fill="none"/>
    <path d="M0,-18 C13,-8 15,4 15,11" stroke="#9A9088" stroke-opacity="0.11" stroke-width="0.5" fill="none"/>
    <line x1="0" y1="42" x2="0" y2="51" stroke="#9A9088" stroke-opacity="0.14" stroke-width="0.9"/>
  </g>

  <!-- SMALL LEAF — upper center-right, floating -->
  <g transform="translate(358, 145) rotate(70)" opacity="0.78">
    <path d="M0,-36 C14,-27 15,8 8,29 C4,36 0,39 0,39 C0,39 -4,36 -8,29 C-15,8 -14,-27 0,-36 Z"
          fill="#B8AFA4" fill-opacity="0.07" stroke="#9A9088" stroke-opacity="0.2" stroke-width="0.9"/>
    <line x1="0" y1="-34" x2="0" y2="37" stroke="#9A9088" stroke-opacity="0.14" stroke-width="0.6"/>
    <path d="M0,-16 C-12,-7 -14,4 -14,10" stroke="#9A9088" stroke-opacity="0.1" stroke-width="0.5" fill="none"/>
    <path d="M0,-16 C12,-7 14,4 14,10" stroke="#9A9088" stroke-opacity="0.1" stroke-width="0.5" fill="none"/>
  </g>

  <!-- MEDIUM LEAF — bottom right -->
  <g transform="translate(598, 560) rotate(52)" opacity="0.83">
    <path d="M0,-58 C22,-44 24,12 13,46 C7,58 0,62 0,62 C0,62 -7,58 -13,46 C-24,12 -22,-44 0,-58 Z"
          fill="#B8AFA4" fill-opacity="0.09" stroke="#9A9088" stroke-opacity="0.25" stroke-width="1.1"/>
    <line x1="0" y1="-55" x2="0" y2="59" stroke="#9A9088" stroke-opacity="0.17" stroke-width="0.72"/>
    <path d="M0,-30 C-20,-17 -23,-1 -23,10" stroke="#9A9088" stroke-opacity="0.13" stroke-width="0.55" fill="none"/>
    <path d="M0,-30 C20,-17 23,-1 23,10" stroke="#9A9088" stroke-opacity="0.13" stroke-width="0.55" fill="none"/>
    <path d="M0,10 C-23,23 -23,34 -19,43" stroke="#9A9088" stroke-opacity="0.11" stroke-width="0.5" fill="none"/>
    <path d="M0,10 C23,23 23,34 19,43" stroke="#9A9088" stroke-opacity="0.11" stroke-width="0.5" fill="none"/>
    <line x1="0" y1="60" x2="0" y2="72" stroke="#9A9088" stroke-opacity="0.16" stroke-width="1"/>
  </g>

  <!-- VERY SMALL accent leaf — lower center -->
  <g transform="translate(292, 598) rotate(-15)" opacity="0.75">
    <path d="M0,-28 C10,-21 11,6 6,22 C3,28 0,30 0,30 C0,30 -3,28 -6,22 C-11,6 -10,-21 0,-28 Z"
          fill="#B8AFA4" fill-opacity="0.07" stroke="#9A9088" stroke-opacity="0.18" stroke-width="0.85"/>
    <line x1="0" y1="-26" x2="0" y2="29" stroke="#9A9088" stroke-opacity="0.12" stroke-width="0.55"/>
  </g>

</svg>
