      <line x1="0" y1="-62" x2="0" y2="52" stroke="#8A8278" stroke-opacity="0.13" stroke-width="0.52"/>
      <path d="M0,-44 C4,-39 10,-35 14,-29" stroke="#8A8278" stroke-opacity="0.1" stroke-width="0.37" fill="none"/>
