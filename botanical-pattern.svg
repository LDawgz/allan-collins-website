      <line x1="0" y1="-21" x2="0" y2="17" stroke="#8A8278" stroke-opacity="0.09" stroke-width="0.34"/>
      <path d="M0,-11 C3,-7 5,-3 5,2" stroke="#8A8278" stroke-opacity="0.07" stroke-width="0.29" fill="none"/>
      <path d="M0,-11 C-3,-7 -5,-3 -5,2" stroke="#8A8278" stroke-opacity="0.07" stroke-width="0.29" fill="none"/>
